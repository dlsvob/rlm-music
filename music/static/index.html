<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>rlm-music — Lineage Graph</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ── Top bar: search ── -->
  <header id="header">
    <h1>rlm-music</h1>
    <a id="author-link" href="https://www.linkedin.com/in/dan-svoboda-sciomellc" target="_blank" rel="noopener" title="Dan Svoboda on LinkedIn">
      LinkedIn: <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
    </a>
    <div id="search-area">
      <input type="text" id="search-input" placeholder="Search artist..." autocomplete="off">
      <button id="search-btn">Go</button>
    </div>
    <div id="stats-bar"></div>
  </header>

  <!-- ── Search results dropdown ── -->
  <div id="search-results" class="hidden"></div>

  <!-- ── Main content ── -->
  <main id="main">
    <!-- SVG ego-graph -->
    <div id="graph-container">
      <svg id="graph-svg"></svg>
      <div id="empty-state">
        <p>Search for an artist to explore their lineage.</p>
      </div>
      <div id="legend"></div>
      <!-- Mobile: button to reopen bottom sheet after dismissal -->
      <button id="info-btn" class="hidden">i</button>
    </div>

    <!-- Desktop: detail panel on the right -->
    <aside id="detail-panel" class="hidden">
      <button id="detail-close">&times;</button>
      <div id="detail-content"></div>
    </aside>
  </main>

  <!-- ── Mobile: detail as bottom sheet ── -->
  <div id="bottom-sheet" class="hidden">
    <div id="bottom-sheet-handle"></div>
    <div id="bottom-sheet-content"></div>
  </div>

  <!-- ── Wikipedia modal overlay ── -->
  <div id="wiki-modal" class="hidden">
    <div id="wiki-modal-box">
      <div class="wiki-toolbar">
        <button class="wiki-back" id="wiki-modal-back" aria-label="Back">&#8592; Back</button>
        <a class="wiki-open-ext" id="wiki-modal-ext" href="#" target="_blank" rel="noopener" title="Open in new tab">&#8599;</a>
        <button id="wiki-modal-close" aria-label="Close">&times;</button>
      </div>
      <iframe id="wiki-modal-iframe" class="wiki-iframe" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
    </div>
  </div>

  <!-- ── Blocking overlay ── -->
  <div id="overlay" class="hidden">
    <div class="overlay-spinner"></div>
    <span id="overlay-text">Loading...</span>
  </div>

  <script src="/static/d3.v7.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
